<!doctype html>
<!-- Design system: existing Editorial Monocle. Same-origin CSS viewport test fixture, not device/keyboard emulation. -->
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RP 窄视口验收夹具</title>
<style>body{margin:0;background:#eaeae4;color:#191917;font:14px system-ui}header{position:sticky;top:0;z-index:5;background:#eaeae4;padding:12px;display:flex;gap:8px;flex-wrap:wrap}button,select{min-height:44px;border:1px solid #6b6b62;background:#f5f5f2;padding:6px 12px;color:#191917}main{display:flex;align-items:flex-start;gap:20px;padding:0 12px 20px}.device-frame{border:2px solid #191917;flex:none}iframe{display:block;border:0;background:#f5f5f2}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:700px;margin:0;font-size:12px;line-height:1.5}h1{font-size:16px;margin:0 12px 10px}small{display:block;padding:0 12px 12px}</style>
<header><select id="size" aria-label="视口"><option>320×568</option><option>390×844</option><option>719×788</option><option>1650×746</option><option>320×360</option><option>390×360</option></select><select id="page" aria-label="页面"><option value="chat.html?chat=chat-lin-1">对话</option><option value="create.html">创作</option><option value="library.html">角色库</option><option value="chats.html">会话</option></select><button id="load">加载页面</button><button id="measure">测量布局</button><button id="stress">填入长草稿</button><button id="modal">打开设定并滚到底</button><button id="close">关闭并检查草稿</button><button id="flow">运行交互检查</button><button id="matrix">运行布局矩阵</button><button id="acceptance">运行窄屏闭环</button></header>
<h1>真实页面 · 固定 CSS 窄视口</h1><small>本夹具仅改变同源 iframe CSS 视口，不代表真实手机、软键盘或浏览器地址栏行为。存档仅存在本测试标签页。</small>
<main><div class="device-frame"><iframe id="frame" title="原型真实页面"></iframe></div><div><textarea id="result" aria-label="测量结果" readonly style="width:700px;min-width:300px;height:420px;border:0;background:transparent;font:12px/1.5 monospace">等待加载</textarea><pre id="json" aria-label="测量结果可读文本" style="max-width:700px;max-height:900px;overflow:auto">等待加载</pre></div></main>
<script>
const frame=document.querySelector('#frame'),output=document.querySelector('#result'),readable=document.querySelector('#json');let savedDraft='',checks=[];
const show=text=>{output.value=text;readable.textContent=text;};
const doc=()=>frame.contentDocument,win=()=>frame.contentWindow,$=s=>doc().querySelector(s),rect=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height,bottom:r.bottom}:null};
const wait=()=>new Promise(r=>{let done=false;const finish=()=>{if(done)return;done=true;r();};setTimeout(finish,180);requestAnimationFrame(()=>requestAnimationFrame(finish));});
let navSeq=0;const busted=url=>'../'+url+(url.includes('?')?'&':'?')+'fixtureRun='+(++navSeq);
function size(){const [w,h]=document.querySelector('#size').value.split('×').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';return {w,h};}
function report(extra={}){const d=doc(),w=win(),vw=d.documentElement.clientWidth,vh=d.documentElement.clientHeight;const out=[...d.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect(),s=w.getComputedStyle(e);return r.width&&s.display!=='none'&&s.position!=='fixed'&&(r.right>vw+1||r.left< -1);}).slice(0,12).map(e=>({tag:e.tagName,id:e.id,class:e.className,rect:rect(e)}));const result={url:w.location.pathname,viewport:{w:vw,h:vh},scrollWidth:d.documentElement.scrollWidth,overflow:out,chat:{head:rect($('.p-chat-head')),status:rect($('.p-rp-status')),reading:rect($('#chat-scroll')),composer:rect($('.p-chat-compose')),input:rect($('#message-input')),inputFont:$('#message-input')?w.getComputedStyle($('#message-input')).fontSize:null,send:rect($('#send-message'))},modal:{dialog:rect($('.p-modal')),close:rect($('.p-modal-close')),body:rect($('.p-modal-body')),scrollTop:$('.p-modal')?.scrollTop,bodyScrollTop:$('.p-modal-body')?.scrollTop},checks,...extra};show(JSON.stringify(result,null,2));return result;}
async function load(){size();checks=[];frame.src='../'+document.querySelector('#page').value;}
frame.addEventListener('load',()=>setTimeout(()=>report(),120));
document.querySelector('#load').onclick=load;document.querySelector('#size').onchange=async()=>{size();await wait();report();};document.querySelector('#measure').onclick=()=>report();
document.querySelector('#stress').onclick=()=>{const input=$('#message-input');if(!input)return;savedDraft='长段中文阅读与输入预算。'.repeat(20)+'\nhttps://example.test/'+ 'a'.repeat(300)+'\n'+Array(12).fill('多行草稿，必须保留。').join('\n');input.value=savedDraft;input.dispatchEvent(new (win().Event)('input',{bubbles:true}));input.focus();report({draftLength:input.value.length});};
document.querySelector('#modal').onclick=async()=>{const trigger=$('#chat-more')||$('#create-preview');trigger?.focus();trigger?.click();await wait();const modal=$('.p-modal'),body=$('.p-modal-body');if(modal)modal.scrollTop=modal.scrollHeight;if(body)body.scrollTop=body.scrollHeight;report();};
document.querySelector('#close').onclick=async()=>{$('.p-modal-close')?.click();await wait();report({draftPreserved:$('#message-input')?.value===savedDraft,activeElement:doc().activeElement?.id,bodyOverflow:doc().body.style.overflow,modalCount:doc().querySelectorAll('.p-modal-root').length});};
document.querySelector('#flow').onclick=async()=>{checks=[];const input=$('#message-input');if(!input){report({note:'此按钮用于聊天，创作和角色库请直接操作页面。'});return;}const W=win(),count=()=>doc().querySelectorAll('#messages article').length;input.value='组合输入不应发送';input.dispatchEvent(new W.Event('input',{bubbles:true}));const before=count();input.dispatchEvent(new W.CompositionEvent('compositionstart',{bubbles:true}));input.dispatchEvent(new W.KeyboardEvent('keydown',{key:'Enter',keyCode:229,bubbles:true,cancelable:true}));checks.push({case:'compositionstart + Enter',pass:count()===before});input.dispatchEvent(new W.CompositionEvent('compositionend',{bubbles:true}));await wait();input.value='长消息\n\n'+ '这是中文长段内容。'.repeat(35)+'\nhttps://example.test/'+'a'.repeat(300);input.dispatchEvent(new W.Event('input',{bubbles:true}));$('#send-message').click();await new Promise(r=>setTimeout(r,1300));checks.push({case:'显式发送保留长消息',pass:[...doc().querySelectorAll('.p-msg-copy')].some(e=>e.textContent.includes('a'.repeat(300)))});const regen=[...doc().querySelectorAll('[data-message-action="regenerate"]')].at(-1);regen?.click();const next=[...doc().querySelectorAll('[data-message-action="previous"]')].at(-1);next?.click();checks.push({case:'候选原位切换',pass:[...doc().querySelectorAll('.p-rp-candidate-index')].at(-1)?.textContent.trim()==='1 / 2'});report();};
document.querySelector('#matrix').onclick=async()=>{const rows=[];for(const page of ['chat.html?chat=chat-lin-1','create.html','library.html']){document.querySelector('#page').value=page;await new Promise(resolve=>{const done=()=>{frame.removeEventListener('load',done);resolve();};frame.addEventListener('load',done);frame.src=busted(page);setTimeout(()=>{frame.removeEventListener('load',done);resolve();},5000);});for(const dimensions of ['320×568','390×844','719×788','1650×746','320×360']){document.querySelector('#size').value=dimensions;size();await wait();const r=report();rows.push({page,dimensions,scrollWidth:r.scrollWidth,overflow:r.overflow,reading:r.chat.reading?.h,composerBottom:r.chat.composer?.bottom,inputHeight:r.chat.input?.h});}}show(JSON.stringify(rows,null,2));window.scrollTo(0,0);};
const params=new URLSearchParams(location.search);if(params.has('size'))document.querySelector('#size').value=params.get('size');if(params.has('page'))document.querySelector('#page').value=params.get('page');
async function navigate(url){await new Promise(resolve=>{const done=()=>{frame.removeEventListener('load',done);resolve();};frame.addEventListener('load',done);frame.src=busted(url);setTimeout(()=>{frame.removeEventListener('load',done);resolve();},5000);});await wait();}
const fill=(selector,value)=>{const e=$(selector);e.value=value;e.dispatchEvent(new (win().Event)('input',{bubbles:true}));};
const topModal=()=>[...doc().querySelectorAll('.p-modal-root')].at(-1);
const closeAll=()=>{while(topModal())topModal().querySelector('.p-modal-close').click();};
async function reachable(element){element.scrollIntoView({block:'center',behavior:'instant'});await wait();const r=rect(element),bar=rect($('.p-tabbar'));return {rect:r,aboveBottomBar:r.bottom<=(bar?.h?bar.y:win().innerHeight)+1,touch:r.h>=44&&r.w>=44};}
document.querySelector('#acceptance').onclick=async()=>{
 const results=[];const check=(name,pass,detail)=>results.push({name,pass,...detail});
 try{for(const dimensions of ['320×568','390×844']){
 document.querySelector('#size').value=dimensions;size();await navigate('chat.html?chat=chat-lin-1');
 const draft='保留草稿\n'+'多行文本\n'.repeat(20);fill('#message-input',draft);const scroll=$('#chat-scroll');scroll.scrollTop=5;
 $('#chat-more').focus();$('#chat-more').click();await wait();const body=$('.p-modal-body');body.scrollTop=body.scrollHeight;const close=rect($('.p-modal-close'));
 check(dimensions+' 长弹窗关闭',close.y>=16&&close.bottom<=win().innerHeight-16&&close.w>=44&&close.h>=44&&(body.scrollHeight<=body.clientHeight+1||body.scrollTop>0),{close,bodyScrollTop:body.scrollTop,bodyClientHeight:body.clientHeight,bodyScrollHeight:body.scrollHeight});
 for(const kind of ['memory','note']){$('#tool-'+kind).click();fill('#context-text',kind+' '+ 'https://example.test/'+'b'.repeat(300));topModal().querySelector('[data-modal-confirm]').click();}
 $('#tool-lore').click();check(dimensions+' 世界书入口与边界',topModal().textContent.includes('最近 12 条'),{});topModal().querySelector('.p-modal-close').click();
 closeAll();check(dimensions+' 草稿焦点恢复',$('#message-input').value===draft&&doc().activeElement.id==='chat-more'&&doc().body.style.position!=='fixed',{});
 const before=doc().querySelectorAll('#messages article').length;$('#message-input').dispatchEvent(new (win().CompositionEvent)('compositionstart',{bubbles:true}));$('#message-input').dispatchEvent(new (win().KeyboardEvent)('keydown',{key:'Enter',bubbles:true}));$('#send-message').click();check(dimensions+' 合成组合输入不误发',doc().querySelectorAll('#messages article').length===before,{});$('#message-input').dispatchEvent(new (win().CompositionEvent)('compositionend',{bubbles:true}));
 fill('#message-input','中文长段。'.repeat(60)+'\nhttps://example.test/'+'a'.repeat(300));$('#send-message').click();await new Promise(r=>setTimeout(r,1200));
 check(dimensions+' 发送长文',doc().querySelectorAll('#messages article').length===before+2,{});
 [...doc().querySelectorAll('[data-message-action="regenerate"]')].at(-1).click();[...doc().querySelectorAll('[data-message-action="previous"]')].at(-1).click();check(dimensions+' 候选切换',[...doc().querySelectorAll('.p-rp-candidate-index')].at(-1).textContent.trim()==='1 / 2',{});
 for(const scale of [.85,1.2]){doc().documentElement.style.setProperty('--rp-font-scale',scale);await wait();const r=report();check(dimensions+' 字号 '+scale,r.scrollWidth<=r.viewport.w+1&&r.overflow.length===0&&parseFloat(r.chat.inputFont)>=16,{scrollWidth:r.scrollWidth,inputFont:r.chat.inputFont});}
 fill('#message-input',draft);const initialH=win().innerHeight;frame.style.height='360px';win().dispatchEvent(new (win().Event)('resize'));await wait();let r=report();check(dimensions+' 缩短至360辅助压力',r.chat.reading.h>=80&&r.chat.send.bottom<=360,{reading:r.chat.reading.h,inputHeight:r.chat.input.h,sendBottom:r.chat.send.bottom});frame.style.height=initialH+'px';win().dispatchEvent(new (win().Event)('resize'));await wait();r=report();check(dimensions+' 高度恢复',r.chat.composer.bottom<=initialH+1&&$('#message-input').value===draft,{height:initialH,composerBottom:r.chat.composer.bottom});
 // Create workflow uses the actual form/events and persisted local state.
 await navigate('create.html');$('#publish-character').click();check(dimensions+' 创作校验',!$('#create-error').hidden&&doc().activeElement.id==='create-name',{});
 fill('#create-name','窄屏验收角色'+dimensions);fill('#create-hook','沿着旧城灯火进入故事');fill('#create-greeting','https://example.test/'+'a'.repeat(300));fill('#create-personality','耐心倾听');fill('#create-scenario','旧城');fill('#create-instructions','PRIVATE_SENTINEL');
 $('#create-preview').focus();$('#create-preview').click();await wait();check(dimensions+' 预览公开字段与换行',!topModal().textContent.includes('PRIVATE_SENTINEL')&&doc().documentElement.scrollWidth<=win().innerWidth+1,{});closeAll();
 $('#character-form').dispatchEvent(new (win().Event)('submit',{bubbles:true,cancelable:true}));check(dimensions+' 草稿保存',$('#create-save-status').textContent.includes('本地文本已保存'),{});
 const publish=await reachable($('#publish-character'));check(dimensions+' 保存公开操作不被底栏遮挡',publish.aboveBottomBar&&publish.touch,publish);
 $('#publish-character').click();$('#publish-agree').checked=true;topModal().querySelector('[data-modal-confirm]').click();check(dimensions+' 仅本地模拟公开',$('#create-save-status').textContent.includes('本地模拟审核'),{});
 const sideStyle=win().getComputedStyle($('.p-create-side'));check(dimensions+' 创作单列无内层限高',sideStyle.maxHeight==='none'&&sideStyle.overflowY==='visible',{maxHeight:sideStyle.maxHeight,overflowY:sideStyle.overflowY});
 await navigate('library.html');const link=$('.p-library-actions a[href*="start=new"]');const linkReach=await reachable(link);check(dimensions+' 角色库操作可达',linkReach.aboveBottomBar&&linkReach.touch,linkReach);
 await new Promise(resolve=>{const done=()=>{frame.removeEventListener('load',done);resolve();};frame.addEventListener('load',done);link.click();setTimeout(()=>{frame.removeEventListener('load',done);resolve();},5000);});await wait();const persona=$('#persona-select');persona.value='wuxia';persona.dispatchEvent(new (win().Event)('change',{bubbles:true}));const start=await reachable($('#start-chat'));check(dimensions+' 角色选择开始入口',start.aboveBottomBar&&start.touch,start);
 await new Promise(resolve=>{const done=()=>{frame.removeEventListener('load',done);resolve();};frame.addEventListener('load',done);$('#start-chat').click();setTimeout(()=>{frame.removeEventListener('load',done);resolve();},5000);});await wait();check(dimensions+' 角色库进入聊天',$('#rp-compose-persona')?.textContent==='古风女侠'&&Boolean($('.p-chat-icon[href="chats.html"]')),{});
 }}catch(error){check('脚本中止',false,{error:String(error),stack:error.stack});}
 show(JSON.stringify({type:'same-origin CSS viewport + synthetic DOM events, NOT real keyboard',passed:results.filter(r=>r.pass).length,total:results.length,results},null,2));window.scrollTo(0,0);
};
if(params.get('run')==='acceptance'){size();document.querySelector('#acceptance').click();}else if(params.get('run')==='matrix'){size();document.querySelector('#matrix').click();}else if(params.get('run')==='stress'){size();frame.addEventListener('load',()=>setTimeout(()=>document.querySelector('#stress').click(),200),{once:true});frame.src='../'+document.querySelector('#page').value;}else if(params.get('run')==='modal'){size();frame.addEventListener('load',()=>setTimeout(()=>document.querySelector('#modal').click(),200),{once:true});frame.src='../'+document.querySelector('#page').value;}else load();
</script></html>
