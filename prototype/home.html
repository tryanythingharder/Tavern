<link rel="stylesheet" href="proto.css?v=20261028-12"><link rel="stylesheet" href="platform.css?v=20261028-14"><link rel="stylesheet" href="editorial.css?v=5">
<style>
    .p-hero { position:relative; display:block; height:260px; margin-bottom:var(--s6); overflow:hidden; border-radius:var(--r-xl); }
    .p-hero .p-cover { position:absolute; inset:0; border-radius:0; }
    .p-hero .p-cover::after { font-size:260px; right:4%; bottom:-18%; color:hsl(var(--h) 30% 30%/.16); }
    .p-hero-shade { position:absolute; inset:0; background:linear-gradient(90deg,rgba(18,18,22,.88),rgba(18,18,22,.58) 44%,rgba(18,18,22,.08) 82%); }
    .p-hero-body { position:absolute; left:clamp(20px,4vw,40px); right:var(--s8); bottom:var(--s8); max-width:580px; color:#fff; }
    .p-hero-body h2 { margin:var(--s3) 0 8px; font-size:var(--f-4xl); letter-spacing:-.02em; line-height:1.2; }
    .p-hero-body p { max-width:42ch; margin-bottom:var(--s5); color:rgba(255,255,255,.85); font-size:var(--f-md); line-height:1.7; }
    .p-hero-actions { display:flex; gap:10px; }
    .p-hero .p-btn--light { border-color:#fff; background:#fff; color:var(--g950); }
    .p-hero .p-btn--light:hover { background:rgba(255,255,255,.86); }
    .p-chiprow { display:flex; gap:var(--s2); margin-bottom:var(--s8); padding-bottom:2px; overflow-x:auto; }
    .p-section { margin-bottom:var(--s10); }
    .p-continue { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(260px,1fr); gap:var(--s3); padding-bottom:4px; overflow-x:auto; scroll-snap-type:x proximity; }
    .p-continue-card { scroll-snap-align:start; }
    .p-shelf { display:grid; grid-auto-flow:column; grid-auto-columns:180px; gap:var(--s4); padding-bottom:4px; overflow-x:auto; }
    .p-loadmore { margin-top:var(--s8); }
    @media(max-width:1023px){.p-hero{height:230px;border-radius:var(--r-lg)}.p-hero-body h2{font-size:var(--f-3xl)}.p-hero-shade{background:linear-gradient(0deg,rgba(18,18,22,.92),rgba(18,18,22,.4) 65%,rgba(18,18,22,.1))}.p-hero-body{bottom:var(--s5);left:var(--s5)}}
    @media(max-width:720px){.p-hero{height:264px}.p-hero-body{right:var(--s5)}.p-hero-body p{display:-webkit-box;max-width:32ch;font-size:var(--f-sm);line-height:1.65;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.p-hero-body h2{font-size:var(--f-3xl)}.p-shelf{grid-auto-columns:156px;gap:var(--s3)}.p-continue{grid-auto-columns:84%;gap:var(--s3)}}
</style>
